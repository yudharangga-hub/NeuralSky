    body {
        background-color: var(--bg-deep);
        color: var(--text-bright);
        font-family: 'Rajdhani', sans-serif;
        min-height: 100vh;
        overflow-x: hidden; margin: 0;
        display: flex; flex-direction: column;
    }

    #neuronCanvas {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1; opacity: 0.5;
    }

    /* TYPOGRAPHY */
    .brand-font { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }
    .tech-font { font-family: 'Share Tech Mono', monospace; }
    .text-cyan { color: var(--neon-cyan) !important; text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
    .text-purple { color: var(--neon-purple) !important; text-shadow: 0 0 10px rgba(188, 19, 254, 0.5); }

    body.theme-light .text-cyan { color: #0b7285 !important; text-shadow: none !important; }
    body.theme-light .text-purple { color: #6d28d9 !important; text-shadow: none !important; }
    body.theme-light .text-white { color: #0f172a !important; }
    body.theme-light .text-muted { color: #475569 !important; }
    body.theme-light .brand-font { color: #0f172a !important; }

    /* UI ELEMENTS */
    .status-indicator {
        color: var(--neon-cyan); border: 1px solid var(--neon-cyan);
        background: rgba(0, 242, 255, 0.1); padding: 5px 15px; border-radius: 5px;
        font-family: 'Share Tech Mono', monospace; font-weight: bold;
        letter-spacing: 2px; text-transform: uppercase;
        box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        animation: statusPulse 1.5s infinite alternate; display: inline-block;
    }
    .role-panel {
        background: rgba(4, 10, 18, 0.92);
        border: 1px solid rgba(0, 242, 255, 0.14);
        border-radius: 24px;
        box-shadow: 0 0 30px rgba(0, 242, 255, 0.08);
    }
    .role-panel .panel-title {
        font-size: 1.1rem;
        letter-spacing: 1px;
        margin-bottom: 0.75rem;
    }
    .role-panel .panel-copy {
        color: rgba(236, 248, 255, 0.84);
        line-height: 1.7;
        font-size: 0.95rem;
    }
    .feature-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 0.95rem;
    }
    .feature-item {
        display: flex;
        align-items: flex-start;
        gap: 0.9rem;
        color: #eaf7ff;
        font-size: 0.97rem;
    }
    .feature-item i {
        margin-top: 4px;
        font-size: 1.05rem;
        min-width: 24px;
        color: var(--neon-cyan);
    }
    .role-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 14px;
        border-radius: 14px;
        background: rgba(0, 242, 255, 0.08);
        border: 1px solid rgba(0, 242, 255, 0.16);
        color: var(--neon-cyan);
        font-size: 0.78rem;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    .panel-note {
        color: rgba(233, 245, 255, 0.78);
        line-height: 1.7;
        font-size: 0.94rem;
    }
    @keyframes statusPulse {
        0% { opacity: 1; text-shadow: 0 0 10px var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 242, 255, 0.5); }
        100% { opacity: 0.5; text-shadow: none; box-shadow: 0 0 5px rgba(0, 242, 255, 0.1); }
    }

    .cyber-box {
        background: rgba(0, 20, 30, 0.8); border-left: 4px solid var(--neon-cyan);
        padding: 20px; margin-bottom: 30px; border-radius: 0 10px 10px 0;
        box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
        font-family: 'Share Tech Mono', monospace; font-size: 1rem; color: var(--text-bright);
        min-height: 80px;
    }
    .cursor {
        display: inline-block; width: 10px; height: 18px; 
        background: var(--neon-cyan); margin-left: 5px; vertical-align: text-bottom;
        animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .hud-panel {
        background: var(--panel-glass); border: 1px solid rgba(0, 242, 255, 0.2);
        backdrop-filter: blur(10px); box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        border-radius: 10px; padding: 30px;
    }

    .nav-pills .nav-link {
        border: 1px solid rgba(255,255,255,0.1); color: var(--text-dim); margin: 0 5px;
        border-radius: 5px; text-transform: uppercase; font-weight: 800; font-family: 'Orbitron', sans-serif;
        transition: 0.3s; background: rgba(0,0,0,0.3); letter-spacing: 1px;
    }
    .nav-pills .nav-link:hover { color: var(--neon-cyan); border-color: var(--neon-cyan); background: rgba(0, 242, 255, 0.1); }
    .nav-pills .nav-link.active {
        background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan);
        box-shadow: 0 0 25px rgba(0, 242, 255, 0.4);
    }

    .btn-cyber {
        background: linear-gradient(90deg, var(--neon-cyan), #0099ff); border: none;
        color: #000; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.2rem;
        padding: 15px; width: 100%; text-transform: uppercase; letter-spacing: 2px;
        box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); transition: 0.3s; border-radius: 5px;
    }
    .btn-cyber:hover { box-shadow: 0 0 40px rgba(0, 242, 255, 0.6); transform: scale(1.02); color: #fff; }

    /* CHARTS & MATRIX */
    .bar-track { background: rgba(255,255,255,0.1); height: 10px; margin-top: 8px; border-radius: 5px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); transition: width 1.5s ease-out; }
    
    .heat-badge {
        font-size: 1.2rem !important; padding: 5px 12px !important; 
        border: 1px solid var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        background: #000; color: var(--neon-cyan); font-family: 'Share Tech Mono', monospace; letter-spacing: 1px;
    }

    .matrix-container {
        border: 1px solid rgba(0, 242, 255, 0.2); padding: 15px; border-radius: 10px;
        background: rgba(0,0,0,0.5); transition: 0.3s; position: relative;
    }
    .matrix-container:hover { border-color: var(--neon-cyan); box-shadow: 0 0 25px rgba(0, 242, 255, 0.3); }
    
    .matrix-wrapper { position: relative; overflow: hidden; border-radius: 5px; cursor: pointer; }
    .matrix-img { width: 100%; height: auto; display: block; border-radius: 5px; transition: 0.3s; }
    .digital-chart { filter: invert(1) hue-rotate(180deg) contrast(1.2) saturate(1.5); border: 1px solid #333; }
    
    .matrix-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(5, 8, 16, 0.7); display: flex; justify-content: center; align-items: center;
        opacity: 0; transition: all 0.3s ease; backdrop-filter: blur(2px); border: 1px solid var(--neon-cyan);
    }
    .matrix-wrapper:hover .matrix-overlay { opacity: 1; }
    
    .zoom-icon {
        font-size: 3rem; color: var(--neon-cyan); text-shadow: 0 0 20px var(--neon-cyan);
        transform: scale(0.5); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .matrix-wrapper:hover .zoom-icon { transform: scale(1); }

    /* FOOTER & MISC */
    footer {
        margin-top: auto; border-top: 1px solid rgba(0, 242, 255, 0.2);
        background: rgba(0, 0, 0, 0.8); padding: 20px 0; text-align: center;
        color: var(--text-dim); font-family: 'Share Tech Mono', monospace; font-size: 0.9rem;
    }
    .logo-header { height: 50px; width: auto; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
    .researcher-info { font-size: 0.85rem; color: var(--text-dim); margin-top: 5px; line-height: 1.4; }
    .researcher-name { color: var(--neon-cyan); font-weight: bold; }
    
    /* MODAL */
    .modal-content { background: #050a10; border: 2px solid var(--neon-cyan); box-shadow: 0 0 50px rgba(0,242,255,0.3); }
    .modal-header { border-bottom: 1px solid var(--neon-cyan); background: rgba(0,242,255,0.1); }
    .btn-close { filter: invert(1) grayscale(100%) brightness(200%); }
    
    /* SCANNER UI */
    .scan-container {
        border: 3px dashed rgba(0, 242, 255, 0.3); height: 400px;
        position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.2); transition: 0.3s; cursor: pointer; border-radius: 10px;
    }
    .scan-container:hover, .scan-container.scanning { border-color: var(--neon-cyan); box-shadow: 0 0 30px rgba(0, 242, 255, 0.2) inset; }
    .neural-grid {
